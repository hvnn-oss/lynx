version: 1
applications:
  - appRoot: apps/lynx-landing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@11.9.0
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile --ignore-scripts
        build:
          commands:
            - pnpm --filter lynx-landing build
      artifacts:
        baseDirectory: apps/lynx-landing/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
          - apps/lynx-landing/.next/cache/**/*
