name: Deploy Next.js app to ECS

on:
  workflow_call:
    inputs:
      app_name:
        description: Human-readable application name.
        required: true
        type: string
      package_filter:
        description: pnpm workspace package name.
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root.
        required: true
        type: string
      environment_name:
        description: GitHub deployment environment containing AWS variables.
        required: true
        type: string
      cache_scope:
        description: GitHub Actions Docker cache scope.
        required: true
        type: string
      run_tests:
        description: Whether the package test script should run.
        required: false
        default: false
        type: boolean
      publish_only:
        description: Build and publish the image without updating ECS.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Publish and deploy ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    timeout-minutes: 60
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      PACKAGE_FILTER: ${{ inputs.package_filter }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment mode
        id: deployment-mode
        shell: bash
        env:
          REQUESTED_PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          publish_variables=(
            AWS_ACCOUNT_ID
            AWS_REGION
            AWS_DEPLOY_ROLE_ARN
            ECR_REPOSITORY
            BACKEND_URL
          )

          for variable_name in "${publish_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::Missing GitHub Actions variable: ${variable_name}"
              exit 1
            fi
          done

          if [ "${REQUESTED_PUBLISH_ONLY}" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy_variables=(
            ECS_CLUSTER
            ECS_SERVICE
            ECS_TASK_DEFINITION
            ECS_CONTAINER_NAME
          )

          for variable_name in "${deploy_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::warning::${variable_name} is not configured. The workflow will publish the image without updating ECS."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application
        run: |
          pnpm exec turbo run lint --filter="${PACKAGE_FILTER}"
          pnpm exec turbo run build --filter="${PACKAGE_FILTER}"

      - name: Test application
        if: inputs.run_tests
        run: pnpm --filter "${PACKAGE_FILTER}" test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: lynx-${{ inputs.package_filter }}-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: image
        shell: bash
        run: |
          CONFIG_HASH="$(printf '%s' "${BACKEND_URL}" | sha256sum | cut -c1-12)"
          IMAGE_TAG="${GITHUB_SHA}-${CONFIG_HASH}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether image already exists
        id: existing-image
        shell: bash
        run: |
          set +e
          IMAGE_LOOKUP="$(
            aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${{ steps.image.outputs.tag }}" \
              --query "imageDetails[0].imageDigest" \
              --output text 2>&1
          )"
          IMAGE_LOOKUP_STATUS=$?
          set -e

          if [ "${IMAGE_LOOKUP_STATUS}" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${IMAGE_LOOKUP}" >> "$GITHUB_OUTPUT"
            echo "Reusing existing immutable image ${IMAGE_LOOKUP}."
          elif grep -q "ImageNotFoundException" <<< "${IMAGE_LOOKUP}"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No image exists for tag ${{ steps.image.outputs.tag }}."
          else
            echo "${IMAGE_LOOKUP}" >&2
            exit "${IMAGE_LOOKUP_STATUS}"
          fi

      - name: Setup Docker Buildx
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            BACKEND_URL=${{ env.BACKEND_URL }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}

      - name: Publish image-only summary
        if: steps.deployment-mode.outputs.deploy != 'true'
        shell: bash
        run: |
          {
            echo "## ${{ inputs.app_name }} image published"
            echo
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Existing immutable image reused: \`${{ steps.existing-image.outputs.exists }}\`"
            echo
            echo "Create the ECS task definition and service with this image, then run the workflow again with publish_only disabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve current service task definition
        if: steps.deployment-mode.outputs.deploy == 'true'
        id: current-task-definition
        shell: bash
        run: |
          CURRENT_TASK_DEFINITION="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query "services[0].taskDefinition" \
              --output text
          )"

          if [[ "${CURRENT_TASK_DEFINITION}" != *":task-definition/${ECS_TASK_DEFINITION}:"* ]]; then
            echo "::error::ECS service uses unexpected task definition: ${CURRENT_TASK_DEFINITION}"
            exit 1
          fi

          echo "arn=${CURRENT_TASK_DEFINITION}" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        if: steps.deployment-mode.outputs.deploy == 'true'
        id: release-metadata
        shell: bash
        run: echo "deployed-at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        if: steps.deployment-mode.outputs.deploy == 'true'
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.current-task-definition.outputs.arn }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            BACKEND_URL=${{ env.BACKEND_URL }}
            RELEASE_SHA=${{ github.sha }}
            DEPLOYED_AT=${{ steps.release-metadata.outputs.deployed-at }}

      - name: Deploy ECS service
        if: steps.deployment-mode.outputs.deploy == 'true'
        id: deploy
        continue-on-error: true
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 30
          wait-max-delay-seconds: 15
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE

      - name: Diagnose failed ECS deployment
        if: steps.deployment-mode.outputs.deploy == 'true' && steps.deploy.outcome == 'failure'
        shell: bash
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
          RENDERED_TASK_DEFINITION: ${{ steps.task-definition.outputs.task-definition }}
        run: |
          set +e

          echo "::group::ECS service state"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].{status:status,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[].{id:id,status:status,rolloutState:rolloutState,reason:rolloutStateReason,taskDefinition:taskDefinition},events:events[0:10].{createdAt:createdAt,message:message}}" \
            --output yaml
          echo "Expected task definition: ${EXPECTED_TASK_DEFINITION}"
          echo "::endgroup::"

          TASK_ARNS="$(
            aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${ECS_SERVICE}" \
              --desired-status STOPPED \
              --max-results 10 \
              --query "taskArns" \
              --output text
          )"

          if [ -n "${TASK_ARNS}" ] && [ "${TASK_ARNS}" != "None" ]; then
            TASK_ARN="$(
              aws ecs describe-tasks \
                --cluster "${ECS_CLUSTER}" \
                --tasks ${TASK_ARNS} \
                --query "reverse(sort_by(tasks,&stoppedAt))[0].taskArn" \
                --output text
            )"

            echo "::group::Latest stopped service task"
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks "${TASK_ARN}" \
              --query "tasks[0].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}" \
              --output yaml

            TASK_ID="${TASK_ARN##*/}"
            LOG_GROUP="$(
              jq -r \
                --arg container_name "${ECS_CONTAINER_NAME}" \
                '.containerDefinitions[]
                  | select(.name == $container_name)
                  | .logConfiguration.options["awslogs-group"] // ""' \
                "${RENDERED_TASK_DEFINITION}"
            )"
            LOG_STREAM_PREFIX="$(
              jq -r \
                --arg container_name "${ECS_CONTAINER_NAME}" \
                '.containerDefinitions[]
                  | select(.name == $container_name)
                  | .logConfiguration.options["awslogs-stream-prefix"] // ""' \
                "${RENDERED_TASK_DEFINITION}"
            )"

            if [ -n "${LOG_GROUP}" ] && [ -n "${LOG_STREAM_PREFIX}" ]; then
              LOG_STREAM="${LOG_STREAM_PREFIX}/${ECS_CONTAINER_NAME}/${TASK_ID}"
              echo
              echo "CloudWatch Logs: ${LOG_GROUP} / ${LOG_STREAM}"
              aws logs get-log-events \
                --log-group-name "${LOG_GROUP}" \
                --log-stream-name "${LOG_STREAM}" \
                --start-from-head \
                --query "events[].message" \
                --output text ||
                echo "::warning::Could not read the service log stream."
            fi
            echo "::endgroup::"
          else
            echo "::warning::No stopped service task was found."
          fi

          echo "::error::${{ inputs.app_name }} ECS deployment failed."
          exit 1

      - name: Verify deployed task definition
        if: steps.deployment-mode.outputs.deploy == 'true'
        shell: bash
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          ACTIVE_TASK_DEFINITION="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query "services[0].taskDefinition" \
              --output text
          )"

          if [ "${ACTIVE_TASK_DEFINITION}" != "${EXPECTED_TASK_DEFINITION}" ]; then
            echo "::error::ECS service is using ${ACTIVE_TASK_DEFINITION}, expected ${EXPECTED_TASK_DEFINITION}."
            exit 1
          fi

      - name: Verify public health endpoint
        if: steps.deployment-mode.outputs.deploy == 'true' && env.HEALTHCHECK_URL != ''
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-delay 5 \
            --retry-all-errors \
            "${HEALTHCHECK_URL%/}/health"

      - name: Publish deployment summary
        if: steps.deployment-mode.outputs.deploy == 'true'
        shell: bash
        run: |
          {
            echo "## ${{ inputs.app_name }} deployment"
            echo
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Release SHA: \`${{ github.sha }}\`"
            echo "- Deployed at: \`${{ steps.release-metadata.outputs.deployed-at }}\`"
            echo "- Task definition: \`${{ steps.deploy.outputs.task-definition-arn }}\`"
            echo "- ECS service: \`${ECS_CLUSTER}/${ECS_SERVICE}\`"
            echo "- Backend URL: \`${BACKEND_URL}\`"
            echo "- Existing immutable image reused: \`${{ steps.existing-image.outputs.exists }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
