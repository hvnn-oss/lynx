name: Sync Lynx docs

on:
  push:
    branches: [main]
    paths:
      - "apps/lynx-docs/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: get_workflow_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          repository: hvnn-oss/lynx-docs
          token: ${{ steps.get_workflow_token.outputs.token }}
          path: docs-repo
          persist-credentials: false

      - name: Sync documentation
        run: |
          rsync -av --delete \
            --exclude=".git" \
            apps/lynx-docs/ docs-repo/

      - name: Commit and push
        working-directory: docs-repo
        env:
          APP_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
        run: |
          git config user.name "lynxops"
          git config user.email "bot@lynxops.co"

          git config --local http.https://github.com "AUTHORIZATION: basic $(echo -n "x-access-token:$APP_TOKEN" | base64)"

          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "docs: sync from monorepo"

          git push origin main
