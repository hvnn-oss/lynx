name: Build and Publish Lynx Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/hono-backend/**"
      - "packages/constants/**"
      - "packages/contract/**"
      - "packages/database/**"
      - "packages/dto/**"
      - "packages/sdk-types/**"
      - "package.json"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-backend.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  # 마이그레이션과 서비스 갱신 도중 새 실행이 이전 배포를 취소하지 않도록 직렬화합니다.
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  BACKEND_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
  ECS_PRIVATE_SUBNET_IDS: ${{ vars.ECS_PRIVATE_SUBNET_IDS }}
  ECS_BACKEND_SECURITY_GROUP_ID: ${{ vars.ECS_BACKEND_SECURITY_GROUP_ID }}

jobs:
  publish:
    name: Verify, publish, and deploy backend
    runs-on: ubuntu-latest
    environment: backend-deploy-prod
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        shell: bash
        run: |
          required_variables=(
            AWS_ACCOUNT_ID
            AWS_REGION
            AWS_DEPLOY_ROLE_ARN
            BACKEND_ECR_REPOSITORY
            ECS_CLUSTER
            ECS_SERVICE
            ECS_TASK_DEFINITION
            ECS_CONTAINER_NAME
            ECS_PRIVATE_SUBNET_IDS
            ECS_BACKEND_SECURITY_GROUP_ID
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::Missing GitHub Actions variable: ${variable_name}"
              exit 1
            fi
          done

          if [[ ! "${ECS_PRIVATE_SUBNET_IDS}" =~ ^subnet-[[:alnum:]]+(,subnet-[[:alnum:]]+)*$ ]]; then
            echo "::error::ECS_PRIVATE_SUBNET_IDS must be a comma-separated list of subnet IDs without spaces."
            exit 1
          fi

          if [[ ! "${ECS_BACKEND_SECURITY_GROUP_ID}" =~ ^sg-[[:alnum:]]+$ ]]; then
            echo "::error::ECS_BACKEND_SECURITY_GROUP_ID must be a security group ID."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter hono-backend build

      - name: Test backend
        run: pnpm --filter hono-backend test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: lynx-backend-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: image
        shell: bash
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${BACKEND_ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Check whether image already exists
        id: existing-image
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.image.outputs.uri }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hono-backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha,scope=lynx-backend
          cache-to: type=gha,mode=max,scope=lynx-backend

      - name: Resolve current service task definition
        id: current-task-definition
        shell: bash
        run: |
          CURRENT_TASK_DEFINITION="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query "services[0].taskDefinition" \
              --output text
          )"

          if [[ "${CURRENT_TASK_DEFINITION}" != *":task-definition/${ECS_TASK_DEFINITION}:"* ]]; then
            echo "::error::ECS service uses unexpected task definition: ${CURRENT_TASK_DEFINITION}"
            exit 1
          fi

          echo "arn=${CURRENT_TASK_DEFINITION}" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: release-metadata
        shell: bash
        run: echo "deployed-at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.current-task-definition.outputs.arn }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            RELEASE_SHA=${{ github.sha }}
            DEPLOYED_AT=${{ steps.release-metadata.outputs.deployed-at }}

      - name: Run migrations and deploy ECS service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 30
          wait-max-delay-seconds: 15
          run-task: true
          run-task-container-overrides: >-
            [{"name":"${{ env.ECS_CONTAINER_NAME }}","command":["node","node_modules/typeorm/cli.js","migration:run","-d","node_modules/@repo/database/dist/data-source.js"]}]
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ env.ECS_PRIVATE_SUBNET_IDS }}
          run-task-security-groups: ${{ env.ECS_BACKEND_SECURITY_GROUP_ID }}
          run-task-assign-public-IP: DISABLED
          run-task-started-by: github-${{ github.run_id }}
          wait-for-task-stopped: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE

      - name: Verify deployed task definition
        shell: bash
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          ACTIVE_TASK_DEFINITION="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query "services[0].taskDefinition" \
              --output text
          )"

          if [ "${ACTIVE_TASK_DEFINITION}" != "${EXPECTED_TASK_DEFINITION}" ]; then
            echo "::error::ECS service is using ${ACTIVE_TASK_DEFINITION}, expected ${EXPECTED_TASK_DEFINITION}. The deployment may have rolled back."
            exit 1
          fi

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Lynx backend deployment"
            echo
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Release SHA: \`${{ github.sha }}\`"
            echo "- Deployed at: \`${{ steps.release-metadata.outputs.deployed-at }}\`"
            echo "- Task definition: \`${{ steps.deploy.outputs.task-definition-arn }}\`"
            echo "- ECS service: \`${ECS_CLUSTER}/${ECS_SERVICE}\`"
            echo
            echo "Existing immutable image reused: \`${{ steps.existing-image.outputs.exists }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
