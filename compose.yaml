name: lynx

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lynx}
      POSTGRES_USER: ${DATABASE_USERNAME:-lynx}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lynx-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lynx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - lynx-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  hono-backend:
    build:
      context: .
      dockerfile: apps/hono-backend/Dockerfile
    environment: &backend-environment
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: http://localhost:3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-lynx}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-lynx}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-lynx-local-password}
      DATABASE_SYNCHRONIZE: "false"
      DATABASE_SSL: "false"
      CORE_REDIS_HOST: redis
      CORE_REDIS_PORT: 6379
      CORE_REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-before-use}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-local}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-local}
      SMTP_SECURE: "false"
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@localhost.test}
      IMAGE_STORAGE_DRIVER: s3
      IMAGE_S3_REGION: ${IMAGE_S3_REGION:-ap-northeast-2}
      IMAGE_S3_BUCKET: ${IMAGE_S3_BUCKET:-lynx-local}
      IMAGE_S3_ACCESS_KEY_ID: ${IMAGE_S3_ACCESS_KEY_ID:-local}
      IMAGE_S3_SECRET_ACCESS_KEY: ${IMAGE_S3_SECRET_ACCESS_KEY:-local}
      IMAGE_CDN_BASE_URL: ${IMAGE_CDN_BASE_URL:-http://localhost:9000/lynx-local}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-bG9jYWwtb25seS1pbnRlZ3JhdGlvbi1rZXktMTIzNDU=}
      FIREWALL_WEBHOOK_SIGNING_SECRET: ${FIREWALL_WEBHOOK_SIGNING_SECRET:-local-only-webhook-signing-secret}
      LYNX_PROCESS_ROLE: api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lynx-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  lynx-migrate:
    build:
      context: .
      dockerfile: apps/hono-backend/Dockerfile
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "node_modules/@repo/database/dist/data-source.js",
      ]
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  lynx-worker:
    build:
      context: .
      dockerfile: apps/hono-backend/Dockerfile
    environment:
      <<: *backend-environment
      LYNX_PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lynx-migrate:
        condition: service_completed_successfully

  lynx-dashboard:
    build:
      context: .
      dockerfile: apps/lynx-dashboard/Dockerfile
      args:
        BACKEND_URL: http://hono-backend:8000
    environment:
      BACKEND_URL: http://hono-backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      hono-backend:
        condition: service_healthy

volumes:
  lynx-postgres:
  lynx-valkey:
